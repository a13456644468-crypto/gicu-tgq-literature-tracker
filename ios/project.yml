name: GICUTGQ
options:
  bundleIdPrefix: com.zju2h
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  GICUTGQ:
    type: application
    platform: iOS
    sources:
      - GICUTGQ
    info:
      path: GICUTGQ/Info.plist
      properties:
        CFBundleDisplayName: GICU-TGQ
        NSPhotoLibraryAddUsageDescription: 保存 ICU Checklist 表格为 JPG 图片
        NSLocalNetworkUsageDescription: 连接院内 GICU-TGQ 文献追踪服务
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zju2h.gicu-tgq
      INFOPLIST_FILE: GICUTGQ/Info.plist
