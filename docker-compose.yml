services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gicu_tgq
      POSTGRES_USER: gicu
      POSTGRES_PASSWORD: gicu_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gicu:gicu_password@db:5432/gicu_tgq
      CORS_ORIGINS: "*"
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
